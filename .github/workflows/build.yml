name: Flutter Build

# GitHub 只识别仓库根 .github/workflows/ 下的工作流，
# 放在 android/.github/ 里不会被触发（踩过一次，构建静默不跑）。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Flutter 工程在仓库的 android/ 子目录，根目录没有 pubspec.yaml
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Build APK (release, arm64)
        # 只编 arm64 单 ABI：universal 包实测 133MB，太浪费。
        # set +e：flutter 工具偶发「Gradle build failed to produce an .apk file」，
        # 但 APK 其实已经生成（路径探测 bug），所以不让这条命令直接把构建判死，
        # 改用 find 显式定位，找不到才 exit 1。
        run: |
          set +e
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          echo "flutter exit=$?"
          mkdir -p apkout
          # 全目录搜：工程根本身叫 android/ 时，flutter 会在「平台目录」
          # （android/android/app/build/outputs/flutter-apk）出包，而工具却去
          # <root>/build/app/outputs 找 —— 两边对不上，硬编码路径必然扑空。
          APK=$(find . -name '*.apk' -not -path './apkout/*' | head -1)
          echo "found: [$APK]"
          if [ -z "$APK" ]; then
            echo "::error::no apk produced"
            find . -name '*.apk' || true
            exit 1
          fi
          cp "$APK" apkout/app-release.apk
          ls -la apkout
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/apkout/app-release.apk
